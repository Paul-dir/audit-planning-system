<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle (Blue) -->
  <circle cx="100" cy="100" r="95" fill="#0052CC" stroke="#003399" stroke-width="2"/>
  
  <!-- Inner Circle (White) -->
  <circle cx="100" cy="100" r="75" fill="#FFFFFF"/>
  
  <!-- Text on outer circle - Ministry of Revenues -->
  <defs>
    <path id="circlePath" d="M 30, 100 A 70, 70 0 0, 1 170, 100" fill="none"/>
    <path id="circlePathReverse" d="M 170, 100 A 70, 70 0 0, 1 30, 100" fill="none"/>
  </defs>
  
  <!-- Top Text -->
  <text font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif" letter-spacing="2">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      MINISTRY OF REVENUES
    </textPath>
  </text>
  
  <!-- Hand/Palm Icon (Gray) -->
  <g transform="translate(100, 65)">
    <!-- Palm base -->
    <ellipse cx="0" cy="5" rx="15" ry="20" fill="#E0E0E0"/>
    <!-- Fingers -->
    <ellipse cx="-10" cy="-12" rx="4" ry="10" fill="#D0D0D0"/>
    <ellipse cx="-4" cy="-15" rx="4" ry="12" fill="#D0D0D0"/>
    <ellipse cx="4" cy="-15" rx="4" ry="12" fill="#D0D0D0"/>
    <ellipse cx="10" cy="-12" rx="4" ry="10" fill="#D0D0D0"/>
  </g>
  
  <!-- Gold Circle (center) -->
  <circle cx="100" cy="80" r="12" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  
  <!-- Gold Ribbon/Banner -->
  <path d="M 115, 75 Q 130, 70 135, 85 Q 140, 100 125, 105" 
        fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Stars on sides -->
  <!-- Left Star -->
  <g transform="translate(35, 100)">
    <polygon points="0,-3 1,-1 3,-1 1,1 2,3 0,2 -2,3 -1,1 -3,-1 -1,-1" fill="#FFFFFF"/>
  </g>
  
  <!-- Right Star -->
  <g transform="translate(165, 100)">
    <polygon points="0,-3 1,-1 3,-1 1,1 2,3 0,2 -2,3 -1,1 -3,-1 -1,-1" fill="#FFFFFF"/>
  </g>
</svg>
