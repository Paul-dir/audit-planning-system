<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle (Blue) -->
  <circle cx="32" cy="32" r="30" fill="#0052CC"/>
  
  <!-- Inner Circle (White) -->
  <circle cx="32" cy="32" r="24" fill="#FFFFFF"/>
  
  <!-- Hand/Palm Icon -->
  <g transform="translate(32, 22)">
    <!-- Palm -->
    <ellipse cx="0" cy="3" rx="5" ry="7" fill="#CCE5FF"/>
    <!-- Fingers -->
    <ellipse cx="-3" cy="-4" rx="1.5" ry="3.5" fill="#99CCFF"/>
    <ellipse cx="-1" cy="-5" rx="1.5" ry="4" fill="#99CCFF"/>
    <ellipse cx="1" cy="-5" rx="1.5" ry="4" fill="#99CCFF"/>
    <ellipse cx="3" cy="-4" rx="1.5" ry="3.5" fill="#99CCFF"/>
  </g>
  
  <!-- Gold Circle -->
  <circle cx="32" cy="28" r="4" fill="#FFD700" stroke="#DAA520" stroke-width="0.5"/>
  
  <!-- Gold Banner/Ribbon -->
  <path d="M 37, 26 Q 42, 24 44, 30 Q 45, 35 40, 37" 
        fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
</svg>
