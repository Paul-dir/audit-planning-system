      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/RiskRule"
                  error:
                    type:
                      - object
