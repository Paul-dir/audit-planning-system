                        type: string
                      code:
                        type: integer
                  meta:
                    type:
                      - object
                      - null
                    additionalProperties: true
    patch:
      tags:
        - Configuration
      summary: "Update a risk indicator's weight, threshold or enabled state"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                weight:
                  type: number
                  minimum: 0
                  maximum: 10
                threshold:
                  type: number
                enabled:
                  type: boolean
                severity:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - critical
            example:
              code: LATE_FILING
              weight: 1.2
              threshold: 0.9
              enabled: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                  - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/RiskRule"
                  error:
                    type:
                      - object
                      - null
                    properties:
                      message:
                        type: string
                      code:
                        type: integer
                  meta:
                    type:
                      - object
                      - null
                    additionalProperties: true
